name: EPG bauen

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Zusaetzliche Sender von Webseiten holen (iptv-org/epg)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git iptv-org
          cd iptv-org
          npm ci --no-audit --no-fund
          npm run grab --- --channels=../iptvorg.channels.xml --output=../iptvorg.xml --days=3 --maxConnections=3
      - run: python build_epg.py
      - name: Logos mit veroeffentlichen
        run: cp -r logos public/logos
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
      # Erst nach dem Veroeffentlichen: Lauf rot markieren, wenn eine Quelle
      # veraltet oder kaputt ist. Die Datei ist dann trotzdem aktualisiert,
      # GitHub schickt aber eine Mail.
      - name: Quellen pruefen
        run: |
          if [ -s warnungen.txt ]; then
            echo "Probleme mit EPG-Quellen:"
            cat warnungen.txt
            exit 1
          fi
          echo "Alle Quellen aktuell."
